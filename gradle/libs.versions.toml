[versions]
# Toolchain
agp = "8.7.3"
mavenPublish = "0.30.0"

# Android platform levels, read by the read3r.* convention plugins in build-logic/.
compileSdk = "34"
minSdk = "21"
targetSdk = "34"

# Runtime dependencies
androidxActivity = "1.8.2"
androidxCore = "1.13.1"
camerax = "1.3.4"
lifecycle = "2.7.0"
zxing = "3.5.3"
# Aligns the kotlin-stdlib variants CameraX and androidx drag in; see qr/build.gradle.kts.
kotlin = "1.8.22"

# Test
junit = "4.13.2"

[libraries]
androidx-activity = { module = "androidx.activity:activity", version.ref = "androidxActivity" }
androidx-core = { module = "androidx.core:core", version.ref = "androidxCore" }
camera-core = { module = "androidx.camera:camera-core", version.ref = "camerax" }
camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "camerax" }
camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "camerax" }
camera-view = { module = "androidx.camera:camera-view", version.ref = "camerax" }
lifecycle-common = { module = "androidx.lifecycle:lifecycle-common", version.ref = "lifecycle" }
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }
kotlin-bom = { module = "org.jetbrains.kotlin:kotlin-bom", version.ref = "kotlin" }
junit = { module = "junit:junit", version.ref = "junit" }

# Consumed only by build-logic/, so the convention plugins can apply these.
android-gradlePlugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
mavenPublish-gradlePlugin = { module = "com.vanniktech:gradle-maven-publish-plugin", version.ref = "mavenPublish" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "mavenPublish" }
