[versions]
# Toolchain
agp = "8.7.3"
mavenPublish = "0.30.0"

# Android platform levels, read by the read3r.* convention plugins in build-logic/.
compileSdk = "34"
minSdk = "21"
targetSdk = "34"

# Runtime dependencies
androidxActivity = "1.8.2"
androidxCore = "1.13.1"
camerax = "1.4.2"
lifecycle = "2.7.0"
zxing = "3.5.3"
# Aligns the kotlin-stdlib variants CameraX and androidx drag in; see qr/build.gradle.kts.
kotlin = "1.8.22"
androidxAnnotation = "1.8.2"
# The published card / passport / qr the sample app consumes (from mavenLocal).
read3r = "0.0.1"

# Test
junit = "4.13.2"

[libraries]
read3r-card = { module = "com.adkhambek.reader:card", version.ref = "read3r" }
read3r-passport = { module = "com.adkhambek.reader:passport", version.ref = "read3r" }
read3r-qr = { module = "com.adkhambek.reader:qr", version.ref = "read3r" }
androidx-activity = { module = "androidx.activity:activity", version.ref = "androidxActivity" }
androidx-core = { module = "androidx.core:core", version.ref = "androidxCore" }
camera-core = { module = "androidx.camera:camera-core", version.ref = "camerax" }
camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "camerax" }
camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "camerax" }
camera-view = { module = "androidx.camera:camera-view", version.ref = "camerax" }
lifecycle-common = { module = "androidx.lifecycle:lifecycle-common", version.ref = "lifecycle" }
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }
kotlin-bom = { module = "org.jetbrains.kotlin:kotlin-bom", version.ref = "kotlin" }
androidx-annotation = { module = "androidx.annotation:annotation", version.ref = "androidxAnnotation" }
junit = { module = "junit:junit", version.ref = "junit" }

# Consumed only by build-logic/, so the convention plugins can apply these.
android-gradlePlugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
mavenPublish-gradlePlugin = { module = "com.vanniktech:gradle-maven-publish-plugin", version.ref = "mavenPublish" }
