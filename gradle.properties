org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
# Reuse task outputs across builds and branches.
org.gradle.caching=true
# Independent modules build concurrently.
org.gradle.parallel=true
# Skip re-running build scripts when nothing they read has changed.
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false

# Coordinates shared by all published libraries.
GROUP=com.adkhambek.reader
VERSION_NAME=2.3.0

# Disable signing for local-only publishing. Re-enable when publishing to Maven Central.
RELEASE_SIGNING_ENABLED=false

# POM metadata. Per-module overrides live in each library's gradle.properties.
POM_URL=https://github.com/adkhambek/nfcard
POM_SCM_URL=https://github.com/adkhambek/nfcard
POM_SCM_CONNECTION=scm:git:git://github.com/adkhambek/nfcard.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://git@github.com/adkhambek/nfcard.git

POM_LICENCE_NAME=The Apache Software License, Version 2.0
POM_LICENCE_URL=https://www.apache.org/licenses/LICENSE-2.0.txt
POM_LICENCE_DIST=repo

POM_DEVELOPER_ID=adkhambek
POM_DEVELOPER_NAME=adkhambek
