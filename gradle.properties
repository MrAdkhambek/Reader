org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
# Reuse task outputs across builds and branches.
org.gradle.caching=true
# Independent modules build concurrently.
org.gradle.parallel=true
# Skip re-running build scripts when nothing they read has changed.
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false

# Coordinates shared by all published libraries.
GROUP=com.adkhambek.reader
VERSION_NAME=0.0.1

# Maven Central via the Central Portal; a successful upload releases itself.
# Credentials and the signing key come from ORG_GRADLE_PROJECT_* env vars in CI
# (.github/workflows/build.yml), or ~/.gradle/gradle.properties locally.
SONATYPE_HOST=CENTRAL_PORTAL
SONATYPE_AUTOMATIC_RELEASE=true
RELEASE_SIGNING_ENABLED=true

# POM metadata. Per-module overrides live in each library's gradle.properties.
POM_URL=https://github.com/MrAdkhambek/Reader
POM_SCM_URL=https://github.com/MrAdkhambek/Reader
POM_SCM_CONNECTION=scm:git:git://github.com/MrAdkhambek/Reader.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://git@github.com/MrAdkhambek/Reader.git

POM_LICENCE_NAME=The Apache Software License, Version 2.0
POM_LICENCE_URL=https://www.apache.org/licenses/LICENSE-2.0.txt
POM_LICENCE_DIST=repo

POM_DEVELOPER_ID=MrAdkhambek
POM_DEVELOPER_NAME=Adkhambek
